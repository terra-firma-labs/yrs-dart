name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust check + clippy + fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/yrs/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/yrs/rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --all-targets
      - run: cargo test

  no-host-paths:
    name: No machine-specific paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The bridge generator writes its own working directory into generated
      # bindings, which once committed an absolute path from a contributor's
      # machine. Nobody reads generated files in review, so gate it here.
      - name: Scan for absolute and machine-specific paths
        run: |
          set -uo pipefail
          # `git grep` rather than `ls-files | xargs grep`: xargs returns 123 if
          # any batch matches nothing, which would mask a hit in another batch.
          # This file is excluded because it necessarily contains the pattern.
          if git grep -nIE \
            '/(Users|home)/[^/"'"'"'[:space:]]+|/private/var/|/Volumes/|[A-Za-z]:[\\/]{1,2}(Users|Documents)' \
            -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Tracked files contain machine-specific paths (see matches above)."
            exit 1
          fi
          echo "No machine-specific paths found."

  dart:
    name: Dart analyze (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
