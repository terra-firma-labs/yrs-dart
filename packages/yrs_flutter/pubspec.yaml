name: yrs_flutter
description: >-
  Experimental Flutter bindings for yrs (the Rust port of Yjs). Thin Flutter
  wrapper around the `yrs` package — handles native library distribution via
  cargokit. Pre-1.0; APIs unstable; not recommended for production.
version: 0.1.0
# Not published to pub.dev. Consumers depend on this repository directly via a
# `git:` dependency pinned to a release tag — which is also why the `yrs` path
# dependency below is fine; a published package could not carry one. Remove this
# line to publish, and swap that path dependency for a version constraint.
publish_to: none
homepage: https://github.com/terra-firma-labs/yrs-dart
repository: https://github.com/terra-firma-labs/yrs-dart
issue_tracker: https://github.com/terra-firma-labs/yrs-dart/issues

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  plugin_platform_interface: ^2.0.2
  yrs:
    path: ../yrs

dev_dependencies:
  ffi: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
